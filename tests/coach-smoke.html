<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>私教模板检查</title><style>body{margin:0;background:#18191b;color:white;font:13px sans-serif}iframe{width:100vw;height:85vh;border:0}pre{white-space:pre-wrap}</style><pre id="result">正在读取私教模板…</pre><iframe src="../dist/"></iframe><script>
document.querySelector('iframe').addEventListener('load',async e=>{try{const w=e.target.contentWindow,d=e.target.contentDocument;w.switchTemplate('coach');await w.ensureTemplateAssets('coach');w.setPlaying(false);const c=d.querySelector('#preview'),hashes=[];for(const t of [0,.5,1.5,2.5,3.5,4.5,6.5]){w.draw(t);const rgba=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let hash=2166136261;for(let i=0;i<rgba.length;i+=47)hash=Math.imul(hash^rgba[i],16777619);hashes.push(hash>>>0);}document.querySelector('#result').textContent=JSON.stringify({width:c.width,height:c.height,samples:hashes.length,uniqueFrames:new Set(hashes).size,pass:c.width===1500&&c.height===1766&&new Set(hashes).size>=3});}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack;}});
</script></html>
