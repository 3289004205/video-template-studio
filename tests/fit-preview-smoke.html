<!doctype html><html><meta charset="utf-8"><title>Fit preview regression</title><style>body{margin:0;font:13px sans-serif;background:#202123;color:#fff}iframe{width:100vw;height:calc(100vh - 65px);border:0}pre{margin:0;white-space:pre-wrap;min-height:65px}</style><pre id="result">Loading previews…</pre><iframe id="app" src="../dist/"></iframe><script>
const frame=document.querySelector('#app'),result=document.querySelector('#result');
const raf=()=>new Promise(r=>requestAnimationFrame(r));
frame.addEventListener('load',async()=>{const d=frame.contentDocument,w=frame.contentWindow,c=d.querySelector('#preview'),v=d.querySelector('#previewViewport'),stage=d.querySelector('#previewStage');const checks=[];let resizeErrors=0;w.addEventListener('error',e=>{if(/ResizeObserver/.test(e.message))resizeErrors++;});
 async function sample(label){for(let i=0;i<8;i++)await raf();const sizes=new Set();let mutations=0;const observer=new MutationObserver(rs=>mutations+=rs.length);observer.observe(c,{attributes:true,attributeFilter:['style','width','height']});for(let i=0;i<60;i++){await raf();const r=c.getBoundingClientRect();sizes.add([r.x,r.y,r.width,r.height,v.clientWidth,v.clientHeight,stage.clientWidth,stage.clientHeight].map(x=>Math.round(x*100)/100).join(','));}observer.disconnect();checks.push({label,geometryVariants:sizes.size,canvasMutations:mutations,canvasSize:[c.width,c.height],pass:sizes.size===1&&mutations===0});result.textContent=JSON.stringify({checks,resizeErrors});}
 try{for(const mode of ['cards','plain','pain','buyer','body','smart','flip','other']){w.switchTemplate(mode);await w.ensureTemplateAssets(mode);await sample(mode+' / fit');}
 const zoom=d.querySelector('#previewZoom');zoom.value='200';zoom.dispatchEvent(new Event('change'));await sample('manual 200%');zoom.value='fit';zoom.dispatchEvent(new Event('change'));await sample('return to fit');frame.style.width='1000px';await sample('resized 1000px');frame.style.width='640px';await sample('mobile 640px');result.textContent=JSON.stringify({complete:true,checks,resizeErrors,pass:checks.every(c=>c.pass)&&resizeErrors===0});}catch(e){result.textContent=JSON.stringify({error:e.message,checks});}
});
</script></html>
